# Include inside the HTTPS server for www.xylcmyka.bond.
location = /EvoLoop-two {
    return 308 /EvoLoop-two/;
}

location = /EvoLoop-two/ {
    return 308 /EvoLoop-two/actuator/health;
}

location ^~ /EvoLoop-two/ {
    proxy_pass http://127.0.0.1:11093/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /EvoLoop-two;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
