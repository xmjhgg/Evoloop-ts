name: Local core and Java cloud
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: evoloop_two_test
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      EVOLOOP_CLOUD_DB_URL: jdbc:mysql://127.0.0.1:3306/evoloop_two_test?connectionTimeZone=UTC
      EVOLOOP_CLOUD_DB_USER: root
      EVOLOOP_CLOUD_DB_PASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9'
          cache: maven
      - run: chmod +x apps/cloud/mvnw
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-verification
          path: |
            apps/cloud/target/surefire-reports/
            apps/cloud/target/evoloop-cloud-0.1.0.jar
